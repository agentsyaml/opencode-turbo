name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    # Token-free publishing via npm Trusted Publishing (OIDC). Configure on
    # npmjs.com → Packages → @alexsun-top/opencode-turbo → Settings → Trusted
    # publishing → GitHub Actions: org "agentsyaml", repo "opencode-turbo",
    # workflow "release.yml", environment "npm", allowed action "npm publish".
    environment: npm
    permissions:
      contents: read
      id-token: write # token-free npm publish via OIDC (+ provenance)
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Upgrade npm for OIDC trusted publishing (>= 11.5.1)
        run: npm install --global npm@12
      - name: Verify tag matches package version
        run: |
          version=$(node -p "require('./package.json').version")
          [[ "v$version" == "${GITHUB_REF_NAME}" ]] || { echo "tag ${GITHUB_REF_NAME} != package version v$version"; exit 1; }
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build:tui
      - run: npm publish --provenance
